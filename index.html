<meta property="og:description" content="Sword x Staff guild on Windward Grace. Rankings, contributions and member profiles.">
<meta property="og:type" content="website">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'media',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: {
          destroyer: '#3b82f6',
          dominator: '#10b981',
          conqueror: '#ef4444',
          guardian: '#f59e0b',
          unknown: '#71717a'
        },
        keyframes: {
          'fade-up': { '0%': { opacity: '0', transform: 'translateY(8px)' }, '100%': { opacity: '1', transform: 'none' } },
          'fade-in': { '0%': { opacity: '0' }, '100%': { opacity: '1' } }
        },
        animation: {
          'fade-up': 'fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) both',
          'fade-in': 'fade-in 0.4s ease-out both'
        }
      }
    }
  };
</script>
<link rel="stylesheet" href="assets/site.css">

</div>

<!-- Fixed top bar: tabs and the snapshot picker. site.js redraws it on every route. -->
<header class="glass fixed inset-x-0 top-0 z-30 border-b border-zinc-200/70 bg-white/80 backdrop-blur-xl dark:border-white/10 dark:bg-zinc-950/80" id="topbar">
  <div class="mx-auto h-12 max-w-6xl px-4 sm:px-6 lg:h-14"></div>
</header>

<main class="mx-auto max-w-6xl px-4 py-6 pt-28 sm:px-6 sm:py-8 sm:pt-28 lg:pt-20" id="app">
  <div class="space-y-4" id="loading" aria-label="Loading guild data">
    <div class="grid grid-cols-2 gap-4 md:grid-cols-5">
      <div class="h-24 animate-pulse rounded-2xl bg-white/50 dark:bg-zinc-800/50"></div><div class="h-24 animate-pulse rounded-2xl bg-white/50 dark:bg-zinc-800/50"></div><div class="h-24 animate-pulse rounded-2xl bg-white/50 dark:bg-zinc-800/50"></div><div class="h-24 animate-pulse rounded-2xl bg-white/50 dark:bg-zinc-800/50"></div><div class="h-24 animate-pulse rounded-2xl bg-white/50 dark:bg-zinc-800/50"></div>
    </div>
    <div class="h-96 animate-pulse rounded-2xl bg-white/50 dark:bg-zinc-800/50"></div>
  </div>
  <div id="error" class="rounded-lg border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900 dark:border-amber-900/50 dark:bg-amber-950/40 dark:text-amber-200" hidden></div>
</main>

<nav class="fixed inset-x-0 bottom-0 z-20 border-t border-white/70 bg-white/70 backdrop-blur-xl md:hidden dark:border-white/10 dark:bg-zinc-950/70" id="dock" hidden aria-label="Player navigation"></nav>

<div class="fixed inset-0 z-40 flex items-center justify-center bg-zinc-950/80 p-4 backdrop-blur-sm" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="In-game capture">
  <button type="button" id="lightbox-close" class="absolute right-4 top-4 grid size-10 place-items-center rounded-full bg-white/10 text-white transition-colors hover:bg-white/20" aria-label="Close"><svg class="size-5" aria-hidden="true"><use href="#i-close"/></svg></button>
  <figure class="m-0 flex max-h-full flex-col items-center gap-3">
    <img id="lightbox-img" class="max-h-[85dvh] w-auto max-w-full rounded-2xl shadow-2xl ring-1 ring-white/10" src="" alt="In-game profile capture">
    <figcaption id="lightbox-cap" class="text-sm text-zinc-300"></figcaption>
  </figure>
</div>

<script src="assets/site.js" defer></script>
</body>
</html>
